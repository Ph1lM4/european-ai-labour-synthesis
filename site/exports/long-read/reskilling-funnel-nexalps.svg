<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Geist, Inter, system-ui, sans-serif">
  <style>
    .bg { fill: #F8F9FA; }
    .cohort { fill: #4A5568; }
    .throughput { fill: #718096; }
    .churn { fill: #A0AEC0; }
    .net-new { fill: #087569; }
    .overline { font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; fill: #4A5568; }
    .title { font-size: 28px; font-weight: 500; letter-spacing: -0.5px; fill: #000000; }
    .row-label { font-size: 16px; font-weight: 500; fill: #000000; }
    .row-sub { font-size: 13px; fill: #4A5568; }
    .bar-text { font-size: 14px; font-weight: 600; fill: #F8F9FA; }
    .value-text { font-size: 16px; font-weight: 600; fill: #000000; }
    .net-new-label { font-size: 13px; font-weight: 700; fill: #087569; }
    .callout-box { fill: #FFFFFF; stroke: #087569; stroke-width: 1.5; }
    .callout-text { font-size: 15px; fill: #000000; }
    .callout-bold { font-size: 15px; font-weight: 700; fill: #087569; }
    .axis-label { font-size: 11px; fill: #718096; }
  </style>
  <rect class="bg" x="0" y="0" width="1280" height="640"/>

  <!-- Header -->
  <text class="overline" x="80" y="60">Reskilling-capacity arithmetic · EU-27 + UK</text>
  <text class="title" x="80" y="100">7.55 M cohort against 450 K of net new annual capacity</text>

  <!-- Row 1: Cohort 7.55M -->
  <text class="row-label" x="80" y="160">Cohort needing reskilling by 2035</text>
  <g transform="translate(80,175)">
    <rect class="cohort" x="0" y="0" width="900" height="56" rx="4"/>
    <text class="bar-text" x="450" y="34" text-anchor="middle">7.55 M workers</text>
  </g>
  <text class="value-text" x="1000" y="210">7.55 M</text>

  <!-- Row 2: Annual training throughput 3.34M (44.2% of 900) -->
  <text class="row-label" x="80" y="275">Annual training throughput</text>
  <g transform="translate(80,290)">
    <rect class="throughput" x="0" y="0" width="397.8" height="56" rx="4"/>
    <text class="bar-text" x="198.9" y="34" text-anchor="middle">3.34 M / year</text>
  </g>
  <text class="value-text" x="1000" y="325">3.34 M / yr</text>

  <!-- Row 3: Absorbed by churn 2.89M (38.3% of 900) -->
  <text class="row-label" x="80" y="390">— absorbed by baseline economic churn</text>
  <g transform="translate(80,405)">
    <rect class="churn" x="0" y="0" width="344.7" height="56" rx="4"/>
    <text class="bar-text" x="172.35" y="34" text-anchor="middle">2.89 M / year</text>
  </g>
  <text class="value-text" x="1000" y="440">2.89 M / yr</text>

  <!-- Row 4: Net new 450K (5.96% of 900 = 53.64) -->
  <text class="row-label" x="80" y="505">— net new capacity for AI transitions</text>
  <g transform="translate(80,520)">
    <rect class="net-new" x="0" y="0" width="53.64" height="56" rx="4"/>
    <text class="net-new-label" x="62" y="35">450 K</text>
  </g>
  <text class="value-text" x="1000" y="555">450 K / yr</text>

  <!-- Callout -->
  <g transform="translate(80,605)">
    <text class="callout-bold" x="0" y="0">~15-year backlog</text>
    <text class="callout-text" x="170" y="0">to clear the 7.55 M cohort at 450 K / year, against a </text>
    <text class="callout-bold" x="660" y="0">1–3 year</text>
    <text class="callout-text" x="730" y="0"> AI displacement window. Response time runs 5–9 years.</text>
  </g>
</svg>
